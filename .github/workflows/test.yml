name: 見積書 自動診断テスト

# mainブランチにコードがアップロード(push)された時に発動
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4
      
      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 必要なパッケージ(Puppeteer等)をインストール
        run: npm install
        
      - name: 診断プログラムを実行
        run: npm test

      - name: スクリーンショット保存
        if: always() # テストが失敗した時でも、原因を確かめるために必ず保存を実行します
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            debug-screenshot.png
            debug-page.html
