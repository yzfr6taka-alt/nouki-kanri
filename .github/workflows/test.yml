name: 見積書 自動診断テスト

on:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: ソース取得
        uses: actions/checkout@v4

      - name: Node.js設定
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: Chromium依存導入
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libgbm1 \
            libasound2t64

      # ★ 修正ポイント①: ローカルサーバーをバックグラウンドで起動
      - name: ローカルサーバー起動
        run: |
          npx http-server . -p 3000 --silent &
          sleep 3

      - name: テスト実行
        run: npm test

      - name: ログ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            logs/**
          include-hidden-files: true
          if-no-files-found: ignore
