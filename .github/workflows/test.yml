[span_1](start_span)name: 見積書 自動診断テスト[span_1](end_span)

# [span_2](start_span)mainブランチにコードがアップロード(push)された時に発動[span_2](end_span)
on:
  push:
    [span_3](start_span)branches: [ main ][span_3](end_span)

jobs:
  test:
    [span_4](start_span)runs-on: ubuntu-latest[span_4](end_span)
    steps:
      - name: リポジトリのコードを取得
        [span_5](start_span)uses: actions/checkout@v4[span_5](end_span)
      
      - name: Node.jsのセットアップ
        [span_6](start_span)uses: actions/setup-node@v4[span_6](end_span)
        with:
          [span_7](start_span)node-version: '20'[span_7](end_span)
          
      - [span_8](start_span)name: 必要なパッケージ(Puppeteer等)をインストール[span_8](end_span)
        [span_9](start_span)run: npm install[span_9](end_span)
        
      - [span_10](start_span)name: 診断プログラムを実行[span_10](end_span)
        [span_11](start_span)run: npm test[span_11](end_span)

      - name: 高度デバッグログ（スクショ・HTML）を保存
        [span_12](start_span)if: always() # テストが失敗した時でも、原因を確かめるために必ず保存を実行します[span_12](end_span)
        [span_13](start_span)uses: actions/upload-artifact@v4[span_13](end_span)
        with:
          name: debug-logs
          path: logs/ # 生成されたlogsフォルダを丸ごと保存します
