name: 見積書 自動診断テスト

# ⚠️ 自動修正の暴走対策で無効化（手動実行のみ）。
#   以前は push:main をトリガに patcher.js が index.html を機械的に書き換え、
#   peter-evans/create-pull-request で auto-fix/patch-* PR を自動生成していた。
#   そのパッチが本番(GitHub Pages)の index.html を破損させたため、
#   ・トリガを push:main → workflow_dispatch（手動）に変更
#   ・「自動修正PRを作成」ステップを削除（自動PR/自動マージを停止）
#   再有効化する場合も、patcher.js の </body> 誤置換・/* AUTO-FIX */ 追記を
#   修正してから / 本番ブランチ以外でのみ実施すること。
on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: ソース取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Node.js設定
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: Chromium依存導入
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libgbm1 \
            libasound2t64

      - name: Git差分取得
        run: |
          git diff HEAD~1 > /tmp/git_diff.txt 2>/dev/null || echo "No diff" > /tmp/git_diff.txt

      - name: ローカルサーバー起動
        run: |
          npx http-server . -p 3000 --silent &
          sleep 3

      - name: テスト実行（診断のみ・自動コミット/PRなし）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_DIFF_FILE: /tmp/git_diff.txt
        run: npm test

      - name: ログ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: logs/**
          if-no-files-found: ignore
